version: 2

models:

  - name: jobs_labelled
    description: >
      Honest fixture. Every test in the package that applies to a
      value/provenance pair is attached here and must pass.
    columns:
      - name: posted_at
        description: "approximated on workday, exact elsewhere"
        data_tests:
          # The precision polarity: a date and its trust label are
          # present together or absent together.
          - honest_data.provenance_is_paired:
              arguments:
                provenance_column: posted_at_precision
                key_column: job_key
          # 3 of 4 rows carry a date. The band is set from that measured
          # reality with slack, not from a round number.
          - honest_data.declared_rate_band:
              arguments:
                epistemic_status: approximated
                min_rate: 0.5

      - name: pay_min
        data_tests:
          # The absence polarity: a missing value and its reason are
          # present together or absent together.
          - honest_data.provenance_is_paired:
              arguments:
                provenance_column: pay_absent_reason
                label_when: value_absent
                key_column: job_key

      - name: pay_absent_reason
        data_tests:
          # 'no_parser_for_source' is a claim about our coverage of a
          # whole source, so any single row from that source carrying pay
          # would falsify it everywhere.
          - honest_data.coverage_claim_holds:
              arguments:
                claim_value: no_parser_for_source
                scope_column: source
                value_column: pay_min

  - name: changes_coherent
    description: "Honest fixture for the claim/evidence and window tests."
    data_tests:
      - honest_data.claim_requires_evidence:
          arguments:
            claim: "change_class = 'material'"
            evidence: "changed_dimensions is not null and changed_dimensions <> ''"
            key_column: job_key
      - honest_data.claim_requires_evidence:
          arguments:
            claim: "changed_dimensions like '%pay%'"
            evidence: "pay_before is not null"
            key_column: job_key
    columns:
      - name: changed_after
        data_tests:
          - honest_data.bounds_are_a_window:
              arguments:
                upper_column: changed_before
                key_column: job_key

  - name: public_safe
    data_tests:
      - honest_data.no_column_names_matching:
          arguments:
            patterns: ["%internal_note%", "%internal_score%"]

  # ---- row accounting, lifecycle, cases, values, switches, groups ----

  - name: listings_source
    description: "Source of truth for the row-accounting and split fixtures."
    data_tests:
      # A clean split: every input row is in exactly one part.
      - honest_data.partitions_into:
          arguments:
            parts: [ref('listings_accepted'), ref('listings_held')]
            key: listing_id

  - name: listings_latest
    data_tests:
      # Every source key is here once, and nothing else is.
      - honest_data.every_row_accounted_for:
          arguments:
            against: ref('listings_source')
            key: listing_id
      # No two rows are the same listing under different keys.
      - honest_data.one_row_per_identity:
          arguments:
            identity: "lower(external_id)"
            key_column: listing_id

  - name: listings_accepted
  - name: listings_held

  - name: lifecycle_in_order
    data_tests:
      - honest_data.stages_are_monotonic:
          arguments:
            stages: [listed_at, first_edited_at, closed_at]
            key_column: listing_id
    columns:
      - name: closed_at
        data_tests:
          - honest_data.not_in_the_future:
              arguments:
                key_column: listing_id

  - name: titles_classified
    data_tests:
      # Includes a pinned null: "Data Center Technician" is in no family.
      - honest_data.known_cases:
          arguments:
            key_column: title
            value_column: role_family
            cases:
              - {key: "Data Analyst", expect: "analyst"}
              - {key: "Head of Data", expect: "leadership"}
              - {key: "Data Center Technician", expect: null}

  - name: cases_typed_values
    data_tests:
      - honest_data.known_cases:
          arguments:
            key_column: title
            value_column: hourly_rate
            cases:
              - {key: "Data Analyst", expect: 15}
              - {key: "Head of Data", expect: 120.5}
      - honest_data.known_cases:
          arguments:
            key_column: title
            value_column: is_remote
            cases:
              - {key: "Data Analyst", expect: true}
              - {key: "Head of Data", expect: false}

  - name: public_values_clean
    data_tests:
      # Columns discovered from the catalog; "?id=77" must not trip the
      # tracking-parameter pattern.
      - honest_data.no_values_matching:
          arguments:
            patterns: ["%canary-%", "%utm_source=%"]

  - name: partner_rows_switch_on
    data_tests:
      # Switch on: the test is inert, by design.
      - honest_data.kill_switch_holds:
          arguments:
            switch_on: "{{ var('partner_feed_enabled_on') }}"
            row_filter: "source = 'partner'"
            key_column: listing_id

  - name: partner_rows_switch_off
    data_tests:
      # Switch off, and no partner row is present.
      - honest_data.kill_switch_holds:
          arguments:
            switch_on: "{{ var('partner_feed_enabled_off') }}"
            row_filter: "source = 'partner'"
            key_column: listing_id

  - name: holds_by_source
    data_tests:
      - honest_data.grouped_share_in_band:
          arguments:
            condition: "is_held"
            group_by: source
            min_share: 0.1
            max_share: 0.5
            min_group_rows: 3
            fail_when_nothing_graded: true

  - name: dates_gradable
    data_tests:
      - honest_data.still_grading:
          arguments:
            row_filter: "posted_at is not null"

  # Strict-scoping behavior: output parts must contain ONLY filtered input keys.
  - name: scoped_source_clean
    data_tests:
      - honest_data.partitions_into:
          arguments:
            parts: [ref('scoped_part_clean')]
            key: listing_id
            row_filter: "source = 'included'"

  # Explicitly opt in to scanning non-string JSON data.
  - name: public_values_structured_clean
    data_tests:
      - honest_data.no_values_matching:
          arguments:
            patterns: ["%CANARY-%"]
            rule_ids: ["synthetic_json_canary"]
            columns: ["cast(payload as varchar)"]

  # NULL identity is only allowed with an explicit opt-out.
  - name: identity_optional_null_ok
    data_tests:
      - honest_data.one_row_per_identity:
          arguments:
            identity: external_id
            key_column: listing_id
            null_identity_is_failure: false

  # Verify both string-valued switch positions are supported.
  - name: partner_on_string_ok
    data_tests:
      - honest_data.kill_switch_holds:
          arguments:
            switch_on: "yes"
            row_filter: "source = 'partner'"
            key_column: listing_id

  - name: partner_off_string_ok
    data_tests:
      - honest_data.kill_switch_holds:
          arguments:
            switch_on: "OFF"
            row_filter: "source = 'partner'"
            key_column: listing_id

  # Only source-wide CLAIMED scopes are required to be identifiable.
  - name: coverage_nonclaim_null_scope
    columns:
      - name: pay_absent_reason
        data_tests:
          - honest_data.coverage_claim_holds:
              arguments:
                claim_value: no_parser_for_source
                scope_column: source
                value_column: pay_min

  # Quoted false regression controls: Jinja strings are truthy unless parsed.
  - name: nullable_identity_quoted_false_ok
    data_tests:
      - honest_data.one_row_per_identity:
          arguments:
            identity: external_id
            key_column: record_id
            null_identity_is_failure: "false"

  - name: equal_stage_quoted_false_ok
    data_tests:
      - honest_data.stages_are_monotonic:
          arguments:
            stages: [recorded_at, confirmed_at]
            key_column: record_id
            strict: "false"

  - name: empty_rate_quoted_false_ok
    columns:
      - name: observed_at
        data_tests:
          - honest_data.declared_rate_band:
              arguments:
                min_rate: 0.9
                fail_on_empty: "false"

  - name: missing_case_quoted_false_ok
    data_tests:
      - honest_data.known_cases:
          arguments:
            key_column: title
            value_column: role_family
            cases:
              - {key: "Data Analyst", expect: "analyst"}
            missing_is_failure: "false"

  - name: ungraded_band_quoted_false_ok
    data_tests:
      - honest_data.grouped_share_in_band:
          arguments:
            condition: is_held
            group_by: source
            min_group_rows: 10
            fail_when_nothing_graded: "false"

  - name: identity_multiple_unidentified_allowed
    data_tests:
      - honest_data.one_row_per_identity:
          arguments:
            identity: external_id
            key_column: record_id
            null_identity_is_failure: false

  # Regression: grouped OR must not bypass the future-date condition.
  - name: filter_or_precedence_ok
    columns:
      - name: observed_on
        data_tests:
          - honest_data.not_in_the_future:
              arguments:
                key_column: record_id
                row_filter: "scope = 'primary' or scope = 'secondary'"

  # Regression: numeric identity 1 must equal numeric 1.0 across relations.
  - name: numeric_keys_derived
    data_tests:
      - honest_data.every_row_accounted_for:
          arguments:
            against: ref('numeric_keys_source')
            key: record_id
      - honest_data.partitions_into:
          arguments:
            parts: [ref('numeric_keys_part_a'), ref('numeric_keys_part_b')]
            key: record_id
